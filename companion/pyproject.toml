[project]
name = "azeroth-chronicle"
version = "0.1.0"
description = "Import and query a personal, spoiler-safe World of Warcraft lore journal."
requires-python = ">=3.9"

# Genuinely nothing is required, including the recap. It talks to a local
# Ollama server over plain HTTP via the standard library, never a hosted
# API, so there is no optional-dependency group to install.
dependencies = []

[project.scripts]
azeroth-chronicle = "azeroth_chronicle.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
