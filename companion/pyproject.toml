[project]
name = "azeroth-chronicle"
version = "0.1.0"
description = "Import and query a personal, spoiler-safe World of Warcraft lore journal."
requires-python = ">=3.9"

# The CLI, import, and every library module are genuinely stdlib-only,
# including the recap - it talks to a local Ollama server over plain HTTP.
dependencies = []

[project.optional-dependencies]
# Needed only to run or build the packaged background app (watcher_app.py),
# for its system tray icon. This is the project's one deliberate, documented
# exception to stdlib-only - see CLAUDE.md. The CLI never imports either.
app = ["pystray>=0.19", "Pillow>=10", "pyinstaller>=6"]

[project.scripts]
azeroth-chronicle = "azeroth_chronicle.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
